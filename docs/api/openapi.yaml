    get:
      tags: [Admin]
      operationId: adminGetMonitoring
      summary: Error rates and service health
      responses:
        '200':
          description: Monitoring
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMonitoring' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from login or refresh; expires after 15 minutes (NFR-SEC-001).

  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PathId:
      name: pathId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Invalid input; `errors` lists each field (`VALIDATION_FAILED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: No valid session (`UNAUTHENTICATED`, BR-005)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Wrong role (`FORBIDDEN`) or onboarding not finished (`ONBOARDING_REQUIRED`, BR-032)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, not owned by the caller, or not published (`NOT_FOUND`, BR-005)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AttemptSubmitted:
      description: The attempt is already submitted (`ATTEMPT_SUBMITTED`, BR-016)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AiLocked:
      description: AI Mentor help is locked until the challenge is `ACCEPTED` (`CHALLENGE_NOT_SOLVED`, BR-017), or Review needs a submission first (`SUBMISSION_REQUIRED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Source code over 64 KB or body over 1 MB (`PAYLOAD_TOO_LARGE`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit or daily AI quota exceeded (`RATE_LIMITED`, `AI_QUOTA_EXCEEDED`); `Retry-After` header and `resetAt` field tell when to retry
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AiUnavailable:
      description: LLM error or timeout (`AI_UNAVAILABLE`); not charged to the quota, the client may retry (BR-021)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ------------------------------------------------------------ Common
    Uuid:
      type: string
      format: uuid
    Problem:
      type: object
      description: RFC 7807 problem details with a stable application `code`.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: 'https://devmentor.example/problems/validation-failed' }
        title: { type: string, example: Dữ liệu không hợp lệ }
        status: { type: integer, example: 422 }
        code: { type: string, example: VALIDATION_FAILED }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: email }
              message: { type: string, example: Email đã được sử dụng }
        resetAt:
          type: string
          format: date-time
          description: For `AI_QUOTA_EXCEEDED`, when the quota resets
        correlationId: { type: string }
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Language:
      type: string
      enum: [C, CPP, PYTHON, JAVA, JAVASCRIPT, SQL]
    Role:
      type: string
      enum: [LEARNER, ADMIN]
    ContentStatus:
      type: string
      enum: [DRAFT, PUBLISHED, HIDDEN]
    LessonType:
      type: string
      enum: [VIDEO, READING, PRACTICE, QUIZ, CHALLENGE]
    PathStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED]
    PathItemStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, SKIPPED]
    TopicHandling:
      type: string
      enum: [LEARN, REVIEW, SKIP]
      description: Learn from scratch, Review, Skip (BR-025)
    SelfRating:
      type: string
      enum: [NOT_LEARNED, UNSURE, CONFIDENT]
    Verdict:
      type: string
      enum: [ACCEPTED, WRONG_ANSWER, RUNTIME_ERROR, TIME_LIMIT_EXCEEDED, MEMORY_LIMIT_EXCEEDED, COMPILE_ERROR, SYSTEM_ERROR]
    Progress:
      type: object
      required: [completed, total, percent]
      description: Skipped items are not counted (BR-022).
      properties:
        completed: { type: integer, example: 3 }
        total: { type: integer, example: 22 }
        percent: { type: integer, minimum: 0, maximum: 100, example: 14 }
    LessonRef:
      type: object
      required: [lessonId, pathId, title, type]
      properties:
        lessonId: { $ref: '#/components/schemas/Uuid' }
        pathId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, example: Số học con trỏ }
        type: { $ref: '#/components/schemas/LessonType' }
        chapterTitle: { type: string, example: Con trỏ }
        position: { type: integer, example: 4 }

    # -------------------------------------------------------------- Auth
    RegisterRequest:
      type: object
      required: [displayName, email, password, acceptTerms]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100, example: Hiếu }
        email: { type: string, format: email }
        password:
          type: string
          format: password
          minLength: 8
          description: At least 8 characters with letters and digits (NFR-SEC-002)
        acceptTerms:
          type: boolean
          enum: [true]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    AuthSession:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access token lifetime in seconds, example: 900 }
        user: { $ref: '#/components/schemas/CurrentUser' }
    CurrentUser:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        onboarding: { $ref: '#/components/schemas/OnboardingStatus' }

    # -------------------------------------------------------- Onboarding
    OnboardingStatus:
      type: object
      required: [completed, step]
      properties:
        completed:
          type: boolean
          description: true once at least one competency profile is confirmed
        step:
          type: string
          enum: [SURVEY, ASSESSMENT, PROFILE, NONE]
          description: The step to resume; `NONE` when no onboarding is in progress
        language: { $ref: '#/components/schemas/Language' }
        surveyId: { $ref: '#/components/schemas/Uuid' }
        attemptId: { $ref: '#/components/schemas/Uuid' }
        profileId: { $ref: '#/components/schemas/Uuid' }
    Topic:
      type: object
      required: [conceptId, name]
      properties:
        conceptId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, example: Con trỏ }
    SurveyRequest:
      type: object
      required: [language, goals, experienceLevel, selfAssessment]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        otherLanguage:
          type: string
          description: Free text when the learner picked "Other"; handling is an open question (BR-031)
        goals:
          type: array
          minItems: 1
          items:
            type: string
            enum: [SCHOOL_COURSES, DSA, INTERVIEWS, PERSONAL_PROJECTS, EMBEDDED_SYSTEMS, HOBBY, OTHER]
        otherGoal: { type: string }
        experienceLevel:
          type: string
          enum: [NEVER_PROGRAMMED, LEVEL_2, BASICS, LEVEL_4, REGULAR_USE]
          description: |
            5 levels from "Never programmed" to "Use it regularly". Only the
            first, "Know the basics" and the last label are known from the
            prototype; middle codes are placeholders.
        selfAssessment:
          type: array
          minItems: 1
          items:
            type: object
            required: [conceptId, rating]
            properties:
              conceptId: { $ref: '#/components/schemas/Uuid' }
              rating: { $ref: '#/components/schemas/SelfRating' }
    Survey:
      allOf:
        - $ref: '#/components/schemas/SurveyRequest'
        - type: object
          required: [id, questionCount, estimatedMinutes, createdAt]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            questionCount: { type: integer, example: 12 }
            estimatedMinutes: { type: integer, example: 10 }
            createdAt: { type: string, format: date-time }
    CompetencyProfile:
      type: object
      required: [id, language, status, overallLevel, score, correctCount, questionCount, handlingCounts, topics, canRetake]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        language: { $ref: '#/components/schemas/Language' }
        status:
          type: string
          enum: [DRAFT, CONFIRMED]
        overallLevel: { type: string, example: Cơ bản }
        score: { type: integer, minimum: 0, maximum: 100, example: 67 }
        correctCount: { type: integer, example: 8 }
        questionCount: { type: integer, example: 12 }
        aiComment:
          type: string
          nullable: true
          description: LLM comment comparing results with the self-assessment; null if generation failed
        handlingCounts:
          type: object
          required: [learn, review, skip]
          properties:
            learn: { type: integer }
            review: { type: integer }
            skip: { type: integer }
        topics:
          type: array
          items: { $ref: '#/components/schemas/ProfileTopic' }
        canRetake:
          type: boolean
          description: false after confirmation (BR-016)
        confirmedAt: { type: string, format: date-time, nullable: true }
    ProfileTopic:
      type: object
      required: [conceptId, name, source, selfRating, suggestedHandling, chosenHandling]
      properties:
        conceptId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, example: Con trỏ }
        source:
          type: string
          enum: [ASSESSED, SURVEY]
          description: SURVEY = "Not tested, from survey"
        score: { type: integer, nullable: true, minimum: 0, maximum: 100, example: 33 }
        correct: { type: integer, nullable: true, example: 1 }
        total: { type: integer, nullable: true, example: 3 }
        selfRating: { $ref: '#/components/schemas/SelfRating' }
        suggestedHandling: { $ref: '#/components/schemas/TopicHandling' }
        chosenHandling: { $ref: '#/components/schemas/TopicHandling' }

    # ------------------------------------------------------------- Paths
    LearningPathSummary:
      type: object
      required: [id, language, courseTitle, level, status, createdAt, progress, skippedCount, aiAddedCount]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        language: { $ref: '#/components/schemas/Language' }
        courseTitle: { type: string, example: Lập trình C chuyên sâu }
        level: { type: string, example: Trung cấp }
        status: { $ref: '#/components/schemas/PathStatus' }
        createdAt: { type: string, format: date-time }
        progress: { $ref: '#/components/schemas/Progress' }
        skippedCount: { type: integer, example: 3 }
        aiAddedCount: { type: integer, example: 1 }
        nextLesson:
          type: object
          allOf:
            - $ref: '#/components/schemas/LessonRef'
          nullable: true
    LearningPathDetail:
      allOf:
        - $ref: '#/components/schemas/LearningPathSummary'
        - type: object
          required: [course, chapters]
          properties:
            course:
              type: object
              required: [id, title, chapterCount, lessonCount]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                title: { type: string }
                chapterCount: { type: integer, example: 6 }
                lessonCount: { type: integer, example: 22 }
                estimatedWeeks: { type: integer, example: 6 }
            chapters:
              type: array
              items:
                type: object
                required: [id, title, position, items]
                properties:
                  id: { $ref: '#/components/schemas/Uuid' }
                  title: { type: string, example: Con trỏ }
                  position: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PathItem' }
    PathItem:
      type: object
      required: [id, lessonId, title, type, position, status, isQuickReview, isAiAdded]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        lessonId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        type: { $ref: '#/components/schemas/LessonType' }
        durationMinutes: { type: integer, nullable: true }
        position: { type: integer }
        status: { $ref: '#/components/schemas/PathItemStatus' }
        isQuickReview: { type: boolean }
        isAiAdded: { type: boolean }
        reason:
          type: string
          nullable: true
          description: Written by the LLM; the order itself comes from rules (BR-025)

    # ----------------------------------------------------------- Lessons
    Lesson:
      type: object
      required: [id, type, title, chapter, progressStatus, isAiAdded]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        pathId: { $ref: '#/components/schemas/Uuid' }
        chapter:
          type: object
          required: [id, title]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            title: { type: string }
        type: { $ref: '#/components/schemas/LessonType' }
        title: { type: string }
        durationMinutes: { type: integer, nullable: true }
        progressStatus: { $ref: '#/components/schemas/PathItemStatus' }
        isAiAdded: { type: boolean }
        content:
          type: string
          nullable: true
          description: Markdown for `READING` lessons
        video:
          type: object
          nullable: true
          description: For `VIDEO` lessons
          required: [url, expiresAt, durationSeconds, resumeAtSecond, checkpoints]
          properties:
            url: { type: string, format: uri, description: Signed Object Storage URL }
            expiresAt: { type: string, format: date-time }
            durationSeconds: { type: integer, example: 720 }
            resumeAtSecond: { type: integer, example: 312 }
            checkpoints:
              type: array
              items: { $ref: '#/components/schemas/Checkpoint' }
        summary: { type: string, nullable: true }
        transcript:
          type: array
          nullable: true
          items:
            type: object
            required: [startSecond, text]
            properties:
              startSecond: { type: integer }
              text: { type: string }
        exerciseId:
          type: string
          format: uuid
          nullable: true
          description: For `PRACTICE` and `CHALLENGE` lessons
        quizId:
          type: string
          format: uuid
          nullable: true
          description: For `QUIZ` lessons
    Checkpoint:
      type: object
      description: In-video question; the correct answer is not included (BR-036)
      required: [id, atSecond, prompt, options]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        atSecond: { type: integer, example: 312 }
        prompt: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/Option' }
    Option:
      type: object
      required: [key, text]
      properties:
        key: { type: string, example: A }
        text: { type: string }
    LessonProgress:
      type: object
      required: [lessonId, status, pathProgress]
      properties:
        lessonId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/PathItemStatus' }
        completedAt: { type: string, format: date-time, nullable: true }
        pathProgress: { $ref: '#/components/schemas/Progress' }
    LessonNotes:
      type: object
      required: [lessonId, content]
      properties:
        lessonId: { $ref: '#/components/schemas/Uuid' }
        content: { type: string }
        updatedAt: { type: string, format: date-time, nullable: true }

    # --------------------------------------------------------- Exercises
    Exercise:
      type: object
      required: [id, lessonId, type, title, statement, language, source, starterCode, editableFile, files, sampleTests, hiddenTestCount, accepted, aiMentorAvailable]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        lessonId: { $ref: '#/components/schemas/Uuid' }
        type:
          type: string
          enum: [PRACTICE, CHALLENGE]
        title: { type: string }
        statement: { type: string, description: Markdown }
        requirements:
          type: array
          items: { type: string }
          description: Shown as a checklist
        examples:
          type: array
          items:
            type: object
            properties:
              input: { type: string }
              output: { type: string }
              explanation: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        source:
          type: string
          enum: [TEAM, AI]
          description: AI = "AI added" practice (BR-035)
        starterCode: { type: string }
        editableFile: { type: string, example: pointer.c }
        files:
          type: array
          description: Read-only supporting files (BR-012)
          items:
            type: object
            required: [path, content]
            properties:
              path: { type: string, example: main.c }
              content: { type: string }
        sampleTests:
          type: array
          items:
            type: object
            required: [id, input, expectedOutput]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              input: { type: string }
              expectedOutput: { type: string }
        hiddenTestCount: { type: integer }
        accepted: { type: boolean }
        bestScore: { type: integer, nullable: true }
        aiMentorAvailable:
          type: boolean
          description: false for a challenge until it is `ACCEPTED` (BR-017)
    ExecutionRequest:
      type: object
      required: [exerciseId, sourceCode, mode]
      properties:
        exerciseId: { $ref: '#/components/schemas/Uuid' }
        sourceCode: { type: string, maxLength: 65536 }
        mode:
          type: string
          enum: [CUSTOM_INPUT, SAMPLE_TESTS]
        input:
          type: string
          description: Required when `mode = CUSTOM_INPUT`
    Execution:
      type: object
      required: [id, exerciseId, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        exerciseId: { $ref: '#/components/schemas/Uuid' }
        status:
          type: string
          enum: [QUEUED, RUNNING, OK, COMPILE_ERROR, RUNTIME_ERROR, TIME_LIMIT_EXCEEDED, MEMORY_LIMIT_EXCEEDED, SYSTEM_ERROR]
        stdout: { type: string, nullable: true }
        stderr: { type: string, nullable: true }
        durationMs: { type: integer, nullable: true }
        sampleResults:
          type: array
          description: Present when `mode = SAMPLE_TESTS`
          items: { $ref: '#/components/schemas/SampleTestResult' }
        createdAt: { type: string, format: date-time }
    SampleTestResult:
      type: object
      required: [testId, passed]
      properties:
        testId: { $ref: '#/components/schemas/Uuid' }
        passed: { type: boolean }
        input: { type: string }
        expectedOutput: { type: string }
        actualOutput: { type: string }
        runtimeMs: { type: integer }
        memoryKb: { type: integer }
    SubmissionRequest:
      type: object
      required: [exerciseId, sourceCode]
      properties:
        exerciseId: { $ref: '#/components/schemas/Uuid' }
        sourceCode: { type: string, maxLength: 65536 }
    SubmissionSummary:
      type: object
      required: [id, exerciseId, status, submittedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        exerciseId: { $ref: '#/components/schemas/Uuid' }
        status:
          type: string
          enum: [PENDING, GRADED]
        verdict:
          type: string
          allOf:
            - $ref: '#/components/schemas/Verdict'
          nullable: true
        score: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        passedTests: { type: integer, nullable: true }
        totalTests: { type: integer, nullable: true }
        submittedAt: { type: string, format: date-time }
    Submission:
      allOf:
        - $ref: '#/components/schemas/SubmissionSummary'
        - type: object
          properties:
            sourceCode: { type: string }
            maxRuntimeMs: { type: integer, nullable: true }
            maxMemoryKb: { type: integer, nullable: true }
            compileOutput: { type: string, nullable: true }
            sampleTests:
              type: array
              items: { $ref: '#/components/schemas/SampleTestResult' }
            hiddenTests:
              type: object
              description: Counts only; hidden content is never returned (BR-014)
              properties:
                passed: { type: integer }
                failed: { type: integer }
            pathProgress:
              type: object
              allOf:
                - $ref: '#/components/schemas/Progress'
              nullable: true

    # ------------------------------------------------------- Assessments
    Question:
      type: object
      required: [id, position, conceptId, conceptName, prompt, options, multipleAnswers]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        position: { type: integer }
        conceptId: { $ref: '#/components/schemas/Uuid' }
        conceptName: { type: string, example: Con trỏ }
        prompt: { type: string }
        code:
          type: string
          nullable: true
          description: Code block shown with the question
        options:
          type: array
          items: { $ref: '#/components/schemas/Option' }
        multipleAnswers:
          type: boolean
          description: true for "select all correct answers" (quizzes only)
    Answer:
      type: object
      required: [questionId]
      properties:
        questionId: { $ref: '#/components/schemas/Uuid' }
        selected:
          type: array
          items: { type: string }
          example: [B]
        dontKnow:
          type: boolean
          default: false
          description: '"I don''t know" (competency assessment only); scores 0'
    AssessmentAttempt:
      type: object
      required: [id, assessmentId, type, status, questions, answers, startedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        assessmentId: { $ref: '#/components/schemas/Uuid' }
        type:
          type: string
          enum: [COMPETENCY, QUIZ]
        title: { type: string, example: 'Quiz: con trỏ' }
        status:
          type: string
          enum: [IN_PROGRESS, SUBMITTED]
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        answers:
          type: array
          items: { $ref: '#/components/schemas/Answer' }
        startedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time, nullable: true }
    AttemptResult:
      type: object
      required: [attemptId, type, score, correctCount, questionCount, skills]
      properties:
        attemptId: { $ref: '#/components/schemas/Uuid' }
        type:
          type: string
          enum: [COMPETENCY, QUIZ]
        score: { type: integer, minimum: 0, maximum: 100 }
        correctCount: { type: integer }
        questionCount: { type: integer }
        passed:
          type: boolean
          nullable: true
          description: Quiz only; null for the competency assessment (no pass/fail)
        skills:
          type: array
          items:
            type: object
            required: [conceptId, name, correct, total]
            properties:
              conceptId: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              correct: { type: integer }
              total: { type: integer }
        review:
          type: array
          description: Quiz only; correct answers and AI Mentor explanations
          items:
            type: object
            required: [questionId, correct, correctAnswers]
            properties:
              questionId: { $ref: '#/components/schemas/Uuid' }
              selected:
                type: array
                items: { type: string }
              correctAnswers:
                type: array
                items: { type: string }
              correct: { type: boolean }
              explanation: { type: string, nullable: true }
        profileId:
          type: string
          format: uuid
          nullable: true
          description: Competency assessment only
        pathUpdate:
          type: object
          nullable: true
          description: Quiz only (BR-035)
          required: [status]
          properties:
            status:
              type: string
              enum: [NONE, PENDING, APPLIED]
            pathId: { $ref: '#/components/schemas/Uuid' }
            addedItems:
              type: array
              items: { $ref: '#/components/schemas/PathItem' }

    # --------------------------------------------------------- AI Mentor
    ExplainRequest:
      type: object
      required: [lessonId]
      properties:
        lessonId: { $ref: '#/components/schemas/Uuid' }
        exerciseId: { $ref: '#/components/schemas/Uuid' }
        conversationId: { $ref: '#/components/schemas/Uuid' }
        selection: { type: string, maxLength: 4000, description: Selected passage }
        conceptId: { $ref: '#/components/schemas/Uuid' }
        quickAction:
          type: string
          enum: [SIMPLER, ANOTHER_EXAMPLE]
        videoPositionSeconds: { type: integer, minimum: 0 }
    AskRequest:
      type: object
      required: [question]
      description: One of `lessonId` or `exerciseId` is required.
      properties:
        lessonId: { $ref: '#/components/schemas/Uuid' }
        exerciseId: { $ref: '#/components/schemas/Uuid' }
        conversationId: { $ref: '#/components/schemas/Uuid' }
        question: { type: string, minLength: 1, maxLength: 4000 }
        videoPositionSeconds: { type: integer, minimum: 0 }
        currentCode: { type: string, maxLength: 65536 }
    HintRequest:
      type: object
      required: [exerciseId, currentCode]
      properties:
        exerciseId: { $ref: '#/components/schemas/Uuid' }
        conversationId: { $ref: '#/components/schemas/Uuid' }
        currentCode: { type: string, maxLength: 65536 }
    DebugRequest:
      type: object
      required: [exerciseId, currentCode]
      description: One of `executionId` or `submissionId` is required.
      properties:
        exerciseId: { $ref: '#/components/schemas/Uuid' }
        conversationId: { $ref: '#/components/schemas/Uuid' }
        currentCode: { type: string, maxLength: 65536 }
        executionId: { $ref: '#/components/schemas/Uuid' }
        submissionId: { $ref: '#/components/schemas/Uuid' }
        testId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: A failing sample test to focus on
    AiMessage:
      type: object
      required: [id, conversationId, mode, content, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        conversationId: { $ref: '#/components/schemas/Uuid' }
        mode:
          type: string
          enum: [EXPLAIN, ASK, HINT, DEBUG, REVIEW]
        content: { type: string, description: 'Markdown, in Vietnamese by default' }
        sources:
          type: array
          items:
            type: object
            required: [lessonId]
            properties:
              lessonId: { $ref: '#/components/schemas/Uuid' }
              section: { type: string }
              videoSecond: { type: integer, nullable: true }
        lineRefs:
          type: array
          items: { type: integer }
          example: [12]
        hintLevel: { type: integer, nullable: true, minimum: 1, maximum: 3 }
        maxHintLevel: { type: integer, nullable: true, example: 3 }
        suggestedActions:
          type: array
          items:
            type: string
            enum: [SIMPLER, ANOTHER_EXAMPLE, NEXT_HINT, GO_TO_LINE, EXPLAIN_FAILING_TEST, REVIEW_CODE]
        createdAt: { type: string, format: date-time }

    # ---------------------------------------------------------- Learning
    Recommendation:
      type: object
      required: [pathId, lesson]
      properties:
        pathId: { $ref: '#/components/schemas/Uuid' }
        lesson: { $ref: '#/components/schemas/LessonRef' }
        reason: { type: string, nullable: true }
        resumeAtSecond: { type: integer, nullable: true }
    ConceptMastery:
      type: object
      required: [conceptId, name, language, source, evidenceCount]
      properties:
        conceptId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: mastery_score × 100; null when not tested
        evidenceCount: { type: integer }
        source:
          type: string
          enum: [MEASURED, SURVEY]
        selfRating:
          type: string
          allOf:
            - $ref: '#/components/schemas/SelfRating'
          nullable: true
    KnowledgeGap:
      type: object
      required: [conceptId, name, score, evidenceCount]
      properties:
        conceptId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        evidenceCount: { type: integer }
        aiPracticeLessonIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }

    # --------------------------------------------------------- Dashboard
    DashboardOverview:
      type: object
      required: [displayName, streak, lessonsCompleted, quizAverage, paths, competency]
      properties:
        displayName: { type: string }
        continueLearning:
          type: object
          nullable: true
          required: [lesson]
          properties:
            lesson: { $ref: '#/components/schemas/LessonRef' }
            minutesLeft: { type: integer, nullable: true, example: 7 }
            resumeAtSecond: { type: integer, nullable: true }
        streak:
          type: object
          required: [current, last7Days]
          properties:
            current: { type: integer, example: 6 }
            last7Days:
              type: array
              minItems: 7
              maxItems: 7
              items:
                type: object
                required: [date, active]
                properties:
                  date: { type: string, format: date }
                  active: { type: boolean }
        lessonsCompleted:
          type: object
          required: [total, thisWeek]
          properties:
            total: { type: integer, example: 12 }
            thisWeek: { type: integer, example: 4 }
        quizAverage:
          type: object
          required: [quizCount]
          properties:
            score: { type: integer, nullable: true, example: 78 }
            quizCount: { type: integer, example: 5 }
        paths:
          type: array
          description: Paths in progress
          items: { $ref: '#/components/schemas/LearningPathSummary' }
        competency:
          type: array
          description: One tab per language
          items:
            type: object
            required: [language, skills]
            properties:
              language: { $ref: '#/components/schemas/Language' }
              skills:
                type: array
                items:
                  type: object
                  required: [conceptId, name]
                  properties:
                    conceptId: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    score: { type: integer, nullable: true }
    TodoItem:
      type: object
      required: [type, lessonId, pathId, title]
      properties:
        type:
          type: string
          enum: [AI_PRACTICE, QUIZ]
        lessonId: { $ref: '#/components/schemas/Uuid' }
        pathId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        durationMinutes: { type: integer, nullable: true }
        reason: { type: string, nullable: true }

    # ------------------------------------------------------------- Admin
    AdminCourseInput:
      type: object
      required: [title, language, difficulty]
      properties:
        title: { type: string }
        description: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        difficulty: { type: string, example: Trung cấp }
    AdminCoursePatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string }
        description: { type: string }
        difficulty: { type: string }
        status: { $ref: '#/components/schemas/ContentStatus' }
    AdminCourse:
      allOf:
        - $ref: '#/components/schemas/AdminCourseInput'
        - type: object
          required: [id, status, createdAt]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            status: { $ref: '#/components/schemas/ContentStatus' }
            createdAt: { type: string, format: date-time }
    AdminModuleInput:
      type: object
      required: [title, position]
      properties:
        title: { type: string }
        position: { type: integer, minimum: 1 }
    AdminModulePatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string }
        position: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/ContentStatus' }
    AdminModule:
      allOf:
        - $ref: '#/components/schemas/AdminModuleInput'
        - type: object
          required: [id, courseId, status]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            courseId: { $ref: '#/components/schemas/Uuid' }
            status: { $ref: '#/components/schemas/ContentStatus' }
    AdminLessonInput:
      type: object
      required: [type, title, position]
      properties:
        type: { $ref: '#/components/schemas/LessonType' }
        title: { type: string }
        position: { type: integer, minimum: 1 }
        content: { type: string, description: Markdown for reading lessons }
        videoObjectKey: { type: string }
        durationSeconds: { type: integer }
        summary: { type: string }
        transcript: { type: string }
        conceptIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        checkpoints:
          type: array
          items:
            type: object
            required: [atSecond, prompt, options, correctAnswer]
            properties:
              atSecond: { type: integer }
              prompt: { type: string }
              options:
                type: array
                items: { $ref: '#/components/schemas/Option' }
              correctAnswer: { type: string }
    AdminLessonPatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string }
        position: { type: integer, minimum: 1 }
        content: { type: string }
        videoObjectKey: { type: string }
        durationSeconds: { type: integer }
        summary: { type: string }
        transcript: { type: string }
        conceptIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ContentStatus' }
    AdminLesson:
      allOf:
        - $ref: '#/components/schemas/AdminLessonInput'
        - type: object
          required: [id, moduleId, status]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            moduleId: { $ref: '#/components/schemas/Uuid' }
            status: { $ref: '#/components/schemas/ContentStatus' }
    AdminExerciseInput:
      type: object
      required: [lessonId, type, title, description, language, starterCode, referenceSolution]
      properties:
        lessonId: { $ref: '#/components/schemas/Uuid' }
        type:
          type: string
          enum: [PRACTICE, CHALLENGE]
        title: { type: string }
        description: { type: string }
        requirements:
          type: array
          items: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        starterCode: { type: string }
        editableFile: { type: string }
        files:
          type: array
          items:
            type: object
            required: [path, content]
            properties:
              path: { type: string }
              content: { type: string }
        referenceSolution: { type: string }
        conceptIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    AdminExercisePatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string }
        description: { type: string }
        requirements:
          type: array
          items: { type: string }
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        starterCode: { type: string }
        files:
          type: array
          items:
            type: object
            required: [path, content]
            properties:
              path: { type: string }
              content: { type: string }
        referenceSolution: { type: string }
        conceptIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ContentStatus' }
    AdminExercise:
      allOf:
        - $ref: '#/components/schemas/AdminExerciseInput'
        - type: object
          required: [id, status]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            status: { $ref: '#/components/schemas/ContentStatus' }
    AdminTestCaseInput:
      type: object
      required: [inputData, expectedOutput, isSample]
      properties:
        inputData: { type: string }
        expectedOutput: { type: string }
        isSample: { type: boolean }
    AdminTestCasePatch:
      type: object
      minProperties: 1
      properties:
        inputData: { type: string }
        expectedOutput: { type: string }
        isSample: { type: boolean }
    AdminTestCase:
      allOf:
        - $ref: '#/components/schemas/AdminTestCaseInput'
        - type: object
          required: [id, exerciseId]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            exerciseId: { $ref: '#/components/schemas/Uuid' }
    AdminAssessmentInput:
      type: object
      required: [lessonId, title]
      properties:
        lessonId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
    AdminAssessmentPatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string }
        status: { $ref: '#/components/schemas/ContentStatus' }
    AdminAssessment:
      allOf:
        - $ref: '#/components/schemas/AdminAssessmentInput'
        - type: object
          required: [id, type, status]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            type:
              type: string
              enum: [QUIZ]
            status: { $ref: '#/components/schemas/ContentStatus' }
    AdminQuestionInput:
      type: object
      required: [conceptId, prompt, options, correctAnswers, position]
      properties:
        conceptId: { $ref: '#/components/schemas/Uuid' }
        prompt: { type: string }
        code: { type: string }
        options:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/Option' }
        correctAnswers:
          type: array
          minItems: 1
          items: { type: string }
        multipleAnswers: { type: boolean, default: false }
        explanation: { type: string }
        position: { type: integer, minimum: 1 }
    AdminQuestionPatch:
      type: object
      minProperties: 1
      properties:
        prompt: { type: string }
        code: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/Option' }
        correctAnswers:
          type: array
          items: { type: string }
        multipleAnswers: { type: boolean }
        explanation: { type: string }
        position: { type: integer, minimum: 1 }
    AdminQuestion:
      allOf:
        - $ref: '#/components/schemas/AdminQuestionInput'
        - type: object
          required: [id, assessmentId]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            assessmentId: { $ref: '#/components/schemas/Uuid' }
    AdminUser:
      type: object
      required: [id, email, displayName, role, isActive, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminStats:
      type: object
      required: [from, to, days, budgetAlert]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items:
            type: object
            required: [date, activeUsers, newLearningPaths, codeRuns, submissions, aiRequests, inputTokens, outputTokens, costUsd]
            properties:
              date: { type: string, format: date }
              activeUsers: { type: integer }
              newLearningPaths:
                type: integer
                description: Replaces "enrollments" in BR-030, which no longer exist; confirm when the admin flow is designed
              codeRuns: { type: integer }
              submissions: { type: integer }
              aiRequests: { type: integer }
              inputTokens: { type: integer }
              outputTokens: { type: integer }
              costUsd: { type: number }
        budgetAlert:
          type: object
          required: [exceeded]
          properties:
            exceeded: { type: boolean }
            dailyBudgetUsd: { type: number, nullable: true }
    AdminMonitoring:
      type: object
      required: [services, sandboxErrorRate, llmErrorRate]
      properties:
        services:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
                enum: [API, WORKER, CODE_EXECUTION, LLM_PROVIDER, DATABASE, REDIS, VECTOR_STORE, OBJECT_STORAGE]
              status:
                type: string
                enum: [UP, DEGRADED, DOWN, UNKNOWN]
        sandboxErrorRate: { type: number, minimum: 0, maximum: 1 }
        llmErrorRate: { type: number, minimum: 0, maximum: 1 }
