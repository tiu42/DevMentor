openapi: 3.0.3
info:
  title: DevMentor API
  version: 0.1.0-draft
  description: |
    HTTP contract between the DevMentor Web Application and the Backend API.

    **Status: DRAFT V1, not implemented.** Endpoint names, fields and
    status codes are proposals derived from the
    [requirements](../../README.md#1-requirements---invest-use-cases-and-acceptance-criteria),
    [use cases](../03-use-cases.md) and
    [business rules](../requirements/business-rules.md). Rule IDs
    (`BR-xxx`), story IDs (`USxx`) and use case IDs (`UCxx`) in the
    descriptions give traceability.

    Conventions (see [API documentation](README.md)):
    - JSON in and out; errors use `application/problem+json`.
    - Authenticated calls send `Authorization: Bearer <accessToken>`.
    - Learner learning APIs return `403` with code `ONBOARDING_REQUIRED`
      until the first competency profile is confirmed (BR-032).
    - A resource owned by another user, or unpublished content, returns
      `404` (BR-005).
servers:
  - url: /api/v1
    description: Relative to the deployment host
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Register, log in, log out, refresh session, current user (US01–US03)
  - name: Onboarding
    description: Survey, competency assessment, competency profile (US04, US32, US33; UC03)
  - name: Learning Paths
    description: My learning paths and path detail (US08, US13, US25; UC06)
  - name: Lessons
    description: Lesson content, video checkpoints, notes, completion (US14; UC08)
  - name: Exercises
    description: Practice exercises and coding challenges (US06, US15)
  - name: Executions
    description: Run code in the sandbox (US17; UC10)
  - name: Submissions
    description: Submit code, verdict and evaluation, history (US07, US18; UC05, UC09)
  - name: Assessments
    description: Quiz attempts and answering any attempt (US04, US05; UC03, UC04)
  - name: AI Mentor
    description: Explain, Ask, Hint, Debug, Review (US19–US23; UC11–UC13)
  - name: Learning
    description: Recommendations, mastery, knowledge gaps (US09–US11)
  - name: Dashboard
    description: Overview and to-do (US24, US25, US27; UC14)
  - name: Admin
    description: Content, test cases, questions, users, statistics and monitoring (US28–US31; UC15–UC17). Admin screens are not designed yet; this group follows the current requirements and may change.

paths:
  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register a learner account
      description: |
        Creates an active `LEARNER` account and starts a session; the client
        then opens the onboarding survey (UC01, BR-001, BR-003, BR-032).
        Google and GitHub sign-in are not available in V1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '409':
          description: Email already registered (`EMAIL_TAKEN`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in
      description: |
        Returns tokens and the current user. A learner whose onboarding is
        not finished is sent back to the step in `user.onboarding`
        (BR-032). Wrong credentials and locked accounts get the same error
        (BR-004). Limited by NFR-SEC-003.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401':
          description: Invalid credentials or locked account (`INVALID_CREDENTIALS`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate the refresh token and get a new access token
      description: Refresh tokens rotate on every use (NFR-SEC-001).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Log out and revoke the refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Current user with onboarding state
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------- Onboarding
  /onboarding/status:
    get:
      tags: [Onboarding]
      operationId: getOnboardingStatus
      summary: Where the learner is in onboarding
      description: Used after login and before any learning screen to resume onboarding (BR-032).
      responses:
        '200':
          description: Onboarding status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /onboarding/topics:
    get:
      tags: [Onboarding]
      operationId: listSurveyTopics
      summary: Topics to self-assess for a language
      description: The topics shown in survey question 4 (BR-031).
      parameters:
        - name: language
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Language' }
      responses:
        '200':
          description: Topics of the language
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Topic' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /onboarding/surveys:
    post:
      tags: [Onboarding]
      operationId: submitSurvey
      summary: Submit the onboarding survey
      description: |
        Starts onboarding for a language: first onboarding after
        registration, or "Create new path" (BR-031, BR-033). A language with
        an `IN_PROGRESS` path is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyRequest' }
      responses:
        '201':
          description: Survey saved; includes the assessment size
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The language already has a path in progress (`PATH_IN_PROGRESS`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /competency-assessments:
    post:
      tags: [Onboarding]
      operationId: startCompetencyAssessment
      summary: Generate the competency assessment and start an attempt
      description: |
        The LLM generates the questions from the survey: 3 per "Unsure"
        topic, 1 per "Confident" topic, none for "Not learned"
        (BR-016, BR-034). Calling it again for the same survey while the
        profile is not confirmed is a retake with new questions; the latest
        submitted attempt replaces the profile. An unsubmitted attempt of
        the same survey is returned instead of a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surveyId]
              properties:
                surveyId: { $ref: '#/components/schemas/Uuid' }
                retake:
                  type: boolean
                  default: false
                  description: true when the learner pressed "Retake the assessment" on the profile.
      responses:
        '201':
          description: Attempt with generated questions (no correct answers)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentAttempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Profile already confirmed (`PROFILE_CONFIRMED`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /competency-profiles/{profileId}:
    get:
      tags: [Onboarding]
      operationId: getCompetencyProfile
      summary: Competency profile with score and handling per topic
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Competency profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetencyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /competency-profiles/{profileId}/topics:
    patch:
      tags: [Onboarding]
      operationId: updateProfileTopics
      summary: Change how topics are handled before confirming
      description: Only while the profile is `DRAFT` (BR-025, BR-032; US33).
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topics]
              properties:
                topics:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [conceptId, handling]
                    properties:
                      conceptId: { $ref: '#/components/schemas/Uuid' }
                      handling: { $ref: '#/components/schemas/TopicHandling' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetencyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Profile already confirmed (`PROFILE_CONFIRMED`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /competency-profiles/{profileId}/confirm:
    post:
      tags: [Onboarding]
      operationId: confirmCompetencyProfile
      summary: Confirm the profile and create the learning path
      description: |
        Chooses one published course of the language by rules and builds
        the path: skipped topics → `SKIPPED`, review topics → "Quick
        review", weak topics earlier where prerequisites allow. The LLM
        writes the item reasons only (BR-025, AS-07).
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '201':
          description: Profile confirmed and path created
          content:
            application/json:
              schema:
                type: object
                required: [profile, path]
                properties:
                  profile: { $ref: '#/components/schemas/CompetencyProfile' }
                  path: { $ref: '#/components/schemas/LearningPathSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already confirmed (`PROFILE_CONFIRMED`) or no published course matches (`NO_MATCHING_COURSE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------ Learning paths
  /learning-paths:
    get:
      tags: [Learning Paths]
      operationId: listLearningPaths
      summary: My learning paths, one per language
      parameters:
        - name: status
          in: query
          description: Filter; omit for all (BR-033)
          schema: { $ref: '#/components/schemas/PathStatus' }
      responses:
        '200':
          description: Paths
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LearningPathSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /learning-paths/{pathId}:
    get:
      tags: [Learning Paths]
      operationId: getLearningPath
      summary: Path detail with chapters and items
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Path detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- Lessons
  /lessons/{lessonId}:
    get:
      tags: [Lessons]
      operationId: getLesson
      summary: Lesson content by type
      description: |
        Video lessons return a short-lived signed video URL, the resume
        position and checkpoints without answers (BR-036). Skipped lessons
        can be opened (BR-022).
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Lesson
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lessons/{lessonId}/complete:
    post:
      tags: [Lessons]
      operationId: completeLesson
      summary: Mark a video or reading lesson complete
      description: |
        Only `VIDEO` and `READING` lessons are completed manually. Practice
        and challenge lessons complete on an `ACCEPTED` submission; quiz
        lessons on a submitted attempt (BR-022).
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Lesson progress and path progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lesson type is not completed manually (`NOT_MANUALLY_COMPLETABLE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /lessons/{lessonId}/position:
    put:
      tags: [Lessons]
      operationId: saveVideoPosition
      summary: Save the video position for resuming
      description: Used by "Continue learning" (BR-026). Clients send it periodically and on pause.
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [videoPositionSeconds]
              properties:
                videoPositionSeconds: { type: integer, minimum: 0 }
      responses:
        '204': { description: Saved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lessons/{lessonId}/checkpoints/{checkpointId}/answer:
    post:
      tags: [Lessons]
      operationId: answerCheckpoint
      summary: Answer an in-video checkpoint question
      description: Not scored; returns right/wrong feedback (BR-036).
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - name: checkpointId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected]
              properties:
                selected:
                  type: string
                  description: Option key
                  example: B
      responses:
        '200':
          description: Feedback
          content:
            application/json:
              schema:
                type: object
                required: [correct, correctAnswer]
                properties:
                  correct: { type: boolean }
                  correctAnswer: { type: string }
                  explanation: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lessons/{lessonId}/notes:
    get:
      tags: [Lessons]
      operationId: getLessonNotes
      summary: The learner's private notes for a lesson
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Notes (empty content when none)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonNotes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Lessons]
      operationId: saveLessonNotes
      summary: Save notes for a lesson
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 20000 }
      responses:
        '200':
          description: Saved notes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonNotes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ----------------------------------------------------------- Exercises
  /exercises/{exerciseId}:
    get:
      tags: [Exercises]
      operationId: getExercise
      summary: Exercise or challenge for the Coding Workspace
      description: Never includes hidden test content (BR-014).
      parameters:
        - $ref: '#/components/parameters/ExerciseId'
      responses:
        '200':
          description: Exercise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exercises/{exerciseId}/submissions:
    get:
      tags: [Submissions]
      operationId: listExerciseSubmissions
      summary: The learner's submission history for an exercise
      parameters:
        - $ref: '#/components/parameters/ExerciseId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Submissions, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SubmissionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------- Executions
  /executions:
    post:
      tags: [Executions]
      operationId: runCode
      summary: Run code with custom input or the sample tests
      description: |
        No verdict and no effect on progress (BR-012). Returns `200` when
        the run finishes within the synchronous threshold, otherwise `202`
        and the client polls (NFR-EXEC-005). Limited to 10 runs/submissions
        per minute (NFR-EXEC-006).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionRequest' }
      responses:
        '200':
          description: Finished run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '202':
          description: Run queued; poll `GET /executions/{executionId}`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /executions/{executionId}:
    get:
      tags: [Executions]
      operationId: getExecution
      summary: Run result
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------- Submissions
  /submissions:
    post:
      tags: [Submissions]
      operationId: submitCode
      summary: Submit a solution for grading
      description: |
        Runs every test case; verdict and score come only from test
        results (BR-012, BR-013, BR-015). Returns `201` when graded within
        the synchronous threshold, otherwise `202` with `status: PENDING`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionRequest' }
      responses:
        '201':
          description: Graded submission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '202':
          description: Grading queued; poll `GET /submissions/{submissionId}`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /submissions/{submissionId}:
    get:
      tags: [Submissions]
      operationId: getSubmission
      summary: Submission with verdict and evaluation
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Submission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------- Assessments
  /quizzes/{quizId}/attempts:
    post:
      tags: [Assessments]
      operationId: startQuizAttempt
      summary: Start (or resume) a quiz attempt
      description: |
        Returns the unsubmitted attempt if one exists; otherwise starts a
        new one. Retakes are unlimited (BR-016).
      parameters:
        - name: quizId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '201':
          description: Attempt started or resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentAttempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assessment-attempts/{attemptId}:
    get:
      tags: [Assessments]
      operationId: getAttempt
      summary: Get an attempt (to resume it)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentAttempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Assessments]
      operationId: saveAnswers
      summary: Save answers of an unsubmitted attempt
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/Answer' }
      responses:
        '200':
          description: Attempt with saved answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentAttempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AttemptSubmitted' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /assessment-attempts/{attemptId}/submit:
    post:
      tags: [Assessments]
      operationId: submitAttempt
      summary: Submit and score an attempt
      description: |
        Competency assessment: no pass/fail; the result links to the draft
        competency profile (`profileId`). Quiz: pass or not by the
        configurable threshold; the review shows correct answers and AI
        Mentor explanations; practice may be added to the path
        (`pathUpdate`, BR-035). Mastery is updated in both cases (BR-023).
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Scored result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AttemptSubmitted' }

  # ----------------------------------------------------------- AI Mentor
  /ai/explain:
    post:
      tags: [AI Mentor]
      operationId: aiExplain
      summary: Explain a concept or a selected passage
      description: Uses the lesson and current video position as context (BR-018; US19).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExplainRequest' }
      responses:
        '200':
          description: Explanation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /ai/ask:
    post:
      tags: [AI Mentor]
      operationId: aiAsk
      summary: Ask the AI Mentor a question (streamed)
      description: |
        Streams the answer as Server-Sent Events (NFR-AI-001): `delta`
        events carry text chunks; a final `done` event carries the whole
        `AiMessage`; an `error` event carries a `Problem`. Off-topic
        questions are declined (BR-018; US23).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: delta
                  data: {"text":"Thử nghĩ xem: "}

                  event: done
                  data: {"id":"5c0e...","conversationId":"0a1b...","mode":"ASK","content":"..."}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /ai/hint:
    post:
      tags: [AI Mentor]
      operationId: aiHint
      summary: Get the next hint level
      description: |
        At most 3 levels, never a complete solution (BR-019). Unavailable
        for a challenge until it is `ACCEPTED` (BR-017).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HintRequest' }
      responses:
        '200':
          description: Hint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AiLocked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /ai/debug:
    post:
      tags: [AI Mentor]
      operationId: aiDebug
      summary: Explain a failing run or submission
      description: Uses only sample test data (BR-014, BR-019; US21).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DebugRequest' }
      responses:
        '200':
          description: Error analysis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AiLocked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /ai/review:
    post:
      tags: [AI Mentor]
      operationId: aiReview
      summary: Review submitted code
      description: Never changes the verdict or score (BR-020; US22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submissionId]
              properties:
                submissionId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AiLocked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /ai/messages/{messageId}/feedback:
    post:
      tags: [AI Mentor]
      operationId: rateAiMessage
      summary: Rate an AI Mentor answer
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: string
                  enum: [HELPFUL, NOT_HELPFUL]
      responses:
        '204': { description: Saved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

